<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B 潛在客戶自動開發與分析工具</title>
    <!-- 引入 Tailwind CSS 確保介面簡潔美觀 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="max-w-5xl mx-auto p-6">
        <!-- 頂部標題區 -->
        <header class="bg-white shadow-sm rounded-xl p-6 mb-6 border border-gray-100">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">🎯 B2B 潛在客戶自動開發與分析工具</h1>
            <p class="text-gray-600 text-sm">運用 Google Gemini API 分析目標市場、定位潛在買家，並自動生成精準的開發策略與郵件。</p>
        </header>

        <!-- 設定與輸入區 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <!-- 左側控制面板 -->
            <div class="bg-white shadow-sm rounded-xl p-6 border border-gray-100 md:col-span-1">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Gemini API Key</label>
                    <input type="password" id="apiKey" placeholder="請輸入您的 API Key" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">目標產業 / 產品 / 服務</label>
                    <input type="text" id="targetIndustry" placeholder="例：浸泡式咖啡包 / 工業設備" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">目標市場 / 地區</label>
                    <input type="text" id="targetMarket" placeholder="例：歐洲經銷商、台灣辦公室福委會" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">開發目的 / 需求</label>
                    <textarea id="targetGoal" rows="3" placeholder="例：尋找B2B批發買家、尋找海外代理商" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <button onclick="generateLeadsStrategy()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition duration-200">
                    開始分析與生成策略
                </button>
            </div>

            <!-- 右側結果展示區 -->
            <div class="bg-white shadow-sm rounded-xl p-6 border border-gray-100 md:col-span-2 flex flex-col">
                <h2 class="text-lg font-semibold text-gray-900 mb-4 pb-2 border-b border-gray-100">分析結果與開發策略</h2>
                <div id="loading" class="hidden flex-1 flex flex-col items-center justify-center text-gray-500 py-12">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-3"></div>
                    <p class="text-sm">AI 正在深度分析市場與潛客切入點，請稍候...</p>
                </div>
                <div id="resultContent" class="flex-1 overflow-y-auto text-sm text-gray-700 leading-relaxed space-y-4">
                    <p class="text-gray-400 italic">尚未執行分析。請在左側填入相關資訊並點擊「開始分析與生成策略」。</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generateLeadsStrategy() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const industry = document.getElementById('targetIndustry').value.trim();
            const market = document.getElementById('targetMarket').value.trim();
            const goal = document.getElementById('targetGoal').value.trim();
            const resultDiv = document.getElementById('resultContent');
            const loadingDiv = document.getElementById('loading');
            const submitBtn = document.getElementById('submitBtn');

            if (!apiKey) {
                alert('請先輸入 Gemini API Key！');
                return;
            }
            if (!industry || !market) {
                alert('請填寫目標產業與目標市場！');
                return;
            }

            // 顯示 Loading
            loadingDiv.classList.remove('hidden');
            resultDiv.innerHTML = '';
            submitBtn.disabled = true;

            const prompt = `
你是一個專業的 B2B 商業開發與市場分析專家。請針對以下需求，為我產出完整的潛在客戶開發計畫：

- 目標產業/產品：${industry}
- 目標市場/地區：${market}
- 開發目的：${goal || '尋找優質 B2B 買家與經銷商'}

請提供以下結構化內容：
1. **潛在買家畫像 (Buyer Persona)**：精準點出這些潛客通常是哪些類型的公司、職稱與決策者。
2. **潛在客戶聚集管道**：他們平常在哪裡出沒？（例如：特定的展會、B2B批發平台、社群群組、垂直網站等）。
3. **搜尋關鍵字策略**：提供可用於 Google 或 LinkedIn 搜尋的關鍵字組合（包含中英文/當地語言建議）。
4. **切入痛點與價值主張**：我們該如何用一句話吸引他們的注意？
5. **高轉換 B2B 開發信範本**：一封可以直接發送給潛在客戶的專業郵件草稿。
`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || 'API 呼叫失敗');
                }

                const textResult = data.candidates[0].content.parts[0].text;
                // 使用 marked 解析 Markdown 格式
                resultDiv.innerHTML = marked.parse(textResult);

            } catch (error) {
                resultDiv.innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded-lg">發生錯誤：${error.message}</div>`;
            } finally {
                loadingDiv.classList.add('hidden');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
