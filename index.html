<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全自動獲客系統 - AI 跨平台行銷與引流儀表板</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

    <div class="max-w-6xl mx-auto p-6">
        <!-- 頂部宣傳標語區 -->
        <header class="bg-gradient-to-r from-purple-900 via-indigo-900 to-blue-900 shadow-xl rounded-2xl p-8 mb-8 border border-purple-500/30 text-center relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-pink-500/10 rounded-full blur-3xl"></div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-3 tracking-tight">
                🚀 1台電腦 = 1000個手機 | 1套系統 = 10個人
            </h1>
            <p class="text-purple-200 text-base md:text-lg font-medium">全自動獲客系統 · 讓獲客更簡單，全球客戶自動找到你</p>
            
            <!-- 支援平台列 -->
            <div class="flex flex-wrap justify-center items-center gap-6 mt-6 pt-6 border-t border-purple-700/50">
                <span class="text-xs uppercase tracking-widest text-purple-300 font-semibold">支援全渠道覆蓋：</span>
                <span class="bg-blue-600/30 text-blue-300 px-3 py-1 rounded-full text-sm font-medium border border-blue-500/30">Facebook</span>
                <span class="bg-pink-600/30 text-pink-300 px-3 py-1 rounded-full text-sm font-medium border border-pink-500/30">Instagram</span>
                <span class="bg-gray-700/50 text-gray-300 px-3 py-1 rounded-full text-sm font-medium border border-gray-600/30">TikTok</span>
                <span class="bg-green-600/30 text-green-300 px-3 py-1 rounded-full text-sm font-medium border border-green-500/30">WhatsApp</span>
                <span class="bg-amber-600/30 text-amber-300 px-3 py-1 rounded-full text-sm font-medium border border-amber-500/30">Google</span>
            </div>
        </header>

        <!-- 主操作介面 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 左側：系統控制面板 -->
            <div class="bg-gray-800/80 backdrop-blur shadow-xl rounded-2xl p-6 border border-gray-700/60 lg:col-span-1 space-y-5">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <span>⚙️</span> 獲客任務配置中心
                </h2>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Gemini API Key</label>
                    <input type="password" id="apiKey" placeholder="請輸入您的 Gemini API Key" class="w-full px-3.5 py-2.5 bg-gray-900 border border-gray-700 rounded-xl text-sm text-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">目標推廣業務 / 產品</label>
                    <input type="text" id="targetBusiness" placeholder="例：跨境電商代營運服務" class="w-full px-3.5 py-2.5 bg-gray-900 border border-gray-700 rounded-xl text-sm text-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">主要引流平台</label>
                    <select id="targetPlatform" class="w-full px-3.5 py-2.5 bg-gray-900 border border-gray-700 rounded-xl text-sm text-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="全平台全渠道 (Omnichannel)">全平台全渠道 (Omnichannel)</option>
                        <option value="Facebook / Instagram 社群私信">Facebook / Instagram 社群私信</option>
                        <option value="TikTok 短影音評論與主頁導流">TikTok 短影音評論與主頁導流</option>
                        <option value="WhatsApp 批量觸達與群發">WhatsApp 批量觸達與群發</option>
                        <option value="Google 關鍵字與地圖潛客">Google 關鍵字與地圖潛客</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">自動化運作設定</label>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-gray-900 p-3 rounded-xl border border-gray-700 text-center">
                            <span class="block text-xs text-gray-400">採集模式</span>
                            <span class="text-sm font-bold text-purple-400">AI 多維度精準採集</span>
                        </div>
                        <div class="bg-gray-900 p-3 rounded-xl border border-gray-700 text-center">
                            <span class="block text-xs text-gray-400">防封號防護</span>
                            <span class="text-sm font-bold text-green-400">多帳號安全隔離</span>
                        </div>
                    </div>
                </div>

                <button onclick="runAutoLeadSystem()" id="submitBtn" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-lg shadow-purple-600/30">
                    🔥 啟動 AI 全自動獲客與腳本生成
                </button>
            </div>

            <!-- 右側：AI 分析與執行結果 -->
            <div class="bg-gray-800/80 backdrop-blur shadow-xl rounded-2xl p-6 border border-gray-700/60 lg:col-span-2 flex flex-col">
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-gray-700">
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <span>📊</span> AI 獲客戰略與即時線索儀表板
                    </h2>
                    <span id="systemStatus" class="px-2.5 py-1 bg-gray-700 text-gray-300 rounded-full text-xs font-medium">系統閒置中</span>
                </div>

                <div id="loading" class="hidden flex-1 flex flex-col items-center justify-center text-gray-400 py-16">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-purple-500 mb-4"></div>
                    <p class="text-sm animate-pulse">AI 機器人正在全球多平台採集數據、模擬觸達中...</p>
                </div>

                <div id="resultContent" class="flex-1 overflow-y-auto text-sm text-gray-300 leading-relaxed space-y-4 max-h-[600px] pr-2">
                    <div class="text-center py-16 text-gray-500 italic">
                        尚未啟動系統。請於左側設定您的推廣業務與目標平台，並點擊按鈕開始運行。
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function runAutoLeadSystem() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const business = document.getElementById('targetBusiness').value.trim();
            const platform = document.getElementById('targetPlatform').value;
            const resultDiv = document.getElementById('resultContent');
            const loadingDiv = document.getElementById('loading');
            const submitBtn = document.getElementById('submitBtn');
            const statusSpan = document.getElementById('systemStatus');

            if (!apiKey) {
                alert('請先輸入您的 Gemini API Key！');
                return;
            }
            if (!business) {
                alert('請填寫目標推廣業務或產品！');
                return;
            }

            // 切換載入狀態
            loadingDiv.classList.remove('hidden');
            resultDiv.innerHTML = '';
            submitBtn.disabled = true;
            statusSpan.className = 'px-2.5 py-1 bg-yellow-500/20 text-yellow-400 border border-yellow-500/30 rounded-full text-xs font-medium animate-pulse';
            statusSpan.innerText = '系統運行中 (AI 採集與觸達)';

            const prompt = `
你是一個頂級的跨平台自動化獲客系統（AI 營銷黑科技機器人）。針對以下業務需求，請為我產出一套完整的自動化引流、精準採集與轉換方案：

- 推廣業務/產品：${business}
- 主力引流平台：${platform}

請以專業、結構化的方式提供以下內容：
1. **全球潛在客戶精準採集策略**：在該平台上，我們該如何設定條件（關鍵字、標籤、社群群組）以自動採集高價值線索？
2. **AI 自動觸達與引流腳本**：提供 2 組高回覆率的私訊／評論引流自動化對話腳本。
3. **高效率轉化漏斗規劃**：如何透過系統自動化跟進，提升詢盤與成交率？
4. **帳號安全與防封號實操建議**：多帳號輪流操作與頻率控制的注意事項。
`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || 'API 呼叫失敗');
                }

                const textResult = data.candidates[0].content.parts[0].text;
                resultDiv.innerHTML = marked.parse(textResult);

                statusSpan.className = 'px-2.5 py-1 bg-green-500/20 text-green-400 border border-green-500/30 rounded-full text-xs font-medium';
                statusSpan.innerText = '系統運作正常 - 數據同步完成';

            } catch (error) {
                resultDiv.innerHTML = `<div class="p-4 bg-red-900/40 border border-red-500/50 text-red-300 rounded-xl">系統異常錯誤：${error.message}</div>`;
                statusSpan.className = 'px-2.5 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded-full text-xs font-medium';
                statusSpan.innerText = '系統異常停止';
            } finally {
                loadingDiv.classList.add('hidden');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
