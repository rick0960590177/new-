<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 跨境客戶開發與開發信生成器</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 1.8rem;
            color: #38bdf8;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .step-section {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            background-color: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            padding: 12px 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .output-box {
            background-color: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-top: 10px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
            color: #e2e8f0;
            max-height: 250px;
            overflow-y: auto;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background-color: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            width: auto;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .script-content {
            display: none;
        }

        .script-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI 跨境客戶開發助理</h1>
        <p class="subtitle">四步驟搞定外貿市場分析、名單搜尋條件與高轉換英文開發信生成</p>

        <!-- 步驟一：定義市場與產品 -->
        <div class="step-section">
            <h3>步驟一：定義產品與目標市場</h3>
            <div class="row">
                <div class="form-group">
                    <label for="productName">你的產品名稱</label>
                    <input type="text" id="productName" value="浸泡式咖啡包 / 環保包裝材料">
                </div>
                <div class="form-group">
                    <label for="targetMarket">目標國家 / 區域</label>
                    <input type="text" id="targetMarket" value="德國 (Germany) / 美國 (USA)">
                </div>
            </div>
            <div class="form-group">
                <label for="productAdvantage">核心競爭優勢</label>
                <input type="text" id="productAdvantage" value="成本降低25%、符合歐盟環保規範、15天快速交貨">
            </div>
            <button onclick="runStepOne()">1. 分析買家畫像與痛點</button>
            <div id="stepOneOutput" class="output-box" style="display:none;"></div>
        </div>

        <!-- 步驟二：Apollo.io 篩選設定 -->
        <div class="step-section">
            <h3>步驟二：Apollo.io 潛在客戶搜尋設定</h3>
            <div class="row">
                <div class="form-group">
                    <label for="searchKeyword">產業關鍵字 (Keywords)</label>
                    <input type="text" id="searchKeyword" value="Coffee Roaster / Packaging Supplier">
                </div>
                <div class="form-group">
                    <label for="decisionMaker">決策者職稱 (Job Titles)</label>
                    <input type="text" id="decisionMaker" value="Procurement Director, Supply Chain Manager">
                </div>
            </div>
            <button onclick="runStepTwo()">2. 生成名單搜尋策略與模擬</button>
            <div id="stepTwoOutput" class="output-box" style="display:none;"></div>
        </div>

        <!-- 步驟三：生成英文開發信 -->
        <div class="step-section">
            <h3>步驟三：生成 3 種切入點的英文開發信</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0;">點擊下方標籤切換不同策略的開發信範本：</p>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('A', event)">A. 痛點切入型</button>
                <button class="tab-btn" onclick="switchTab('B', event)">B. 法規/趨勢型</button>
                <button class="tab-btn" onclick="switchTab('C', event)">C. 同業案例型</button>
            </div>

            <div id="scriptA" class="script-content active">
                <div class="output-box" id="emailA">點擊上方按鈕或執行步驟一後自動載入...</div>
            </div>
            <div id="scriptB" class="script-content">
                <div class="output-box" id="emailB">載入中...</div>
            </div>
            <div id="scriptC" class="script-content">
                <div class="output-box" id="emailC">載入中...</div>
            </div>
        </div>

        <!-- 步驟四：覆盤與優化 -->
        <div class="step-section">
            <h3>步驟四：AI 數據覆盤與回覆優化</h3>
            <div class="form-group">
                <label for="feedbackData">客戶實際反應或回信內容 (選填)</label>
                <textarea id="feedbackData" rows="2" placeholder="例如：客戶回信說價格還可以，但擔心海外運輸交期太久不穩定..."></textarea>
            </div>
            <button onclick="runStepFour()">4. 讓 AI 優化信件腳本</button>
            <div id="stepFourOutput" class="output-box" style="display:none;"></div>
        </div>

    </div>

    <script>
        function runStepOne() {
            const product = document.getElementById('productName').value;
            const market = document.getElementById('targetMarket').value;
            const adv = document.getElementById('productAdvantage').value;
            
            const output = document.getElementById('stepOneOutput');
            output.style.display = 'block';
            output.innerText = `【AI 市場分析結果】\n` +
                `- 產品：${product}\n` +
                `- 目標市場：${market}\n` +
                `- 優勢：${adv}\n\n` +
                `1. 潛在買家畫像：當地中小型品牌商、批發通路採購總監。\n` +
                `2. 核心痛點：供應鏈不穩定、現有供應商交期過長、面臨嚴格環保與成本雙重壓力。\n` +
                `3. 篩選共識：買家極度看重「品質穩定性」與「合規證明文件」。`;
        }

        function runStepTwo() {
            const keyword = document.getElementById('searchKeyword').value;
            const title = document.getElementById('decisionMaker').value;
            
            const output = document.getElementById('stepTwoOutput');
            output.style.display = 'block';
            output.innerText = `【Apollo.io 搜尋參數建議】\n` +
                `- Location: Germany / United States\n` +
                `- Industry Keywords: ${keyword}\n` +
                `- Job Titles: ${title}\n` +
                `- 預計產出：已成功模擬篩選出 50 筆符合條件的企業決策者清單，建議匯出為 CSV 檔準備進行分批發送。`;
        }

        function switchTab(type, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.script-content').forEach(content => content.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById('script' + type).classList.add('active');
            
            // 動態帶入範本內容
            const product = document.getElementById('productName').value;
            
            if (type === 'A') {
                document.getElementById('emailA').innerText = 
                    `Subject: Quick question regarding your supply chain at [Company Name]\n\n` +
                    `Hi [First Name],\n\n` +
                    `I noticed [Company Name] has been expanding its portfolio in the market. Many procurement leaders I speak with are currently struggling with rising material costs and unstable lead times.\n\n` +
                    `We help companies like yours source ${product} with a 25% reduction in procurement costs while maintaining strict quality standards and a 15-day delivery window.\n\n` +
                    `Are you open to reviewing a quick 2-page spec sheet this week?\n\n` +
                    `Best regards,\n[Your Name]`;
            } else if (type === 'B') {
                document.getElementById('emailB').innerText = 
                    `Subject: Meeting upcoming EU/US regulations for [Company Name]\n\n` +
                    `Hi [First Name],\n\n` +
                    `With the latest regulatory shifts in the region, ensuring full compliance for ${product} has become a top priority for procurement teams.\n\n` +
                    `Our solutions are 100% certified and designed to help you stay ahead of compliance while optimizing your supply chain expenses.\n\n` +
                    `Would you be available for a brief 10-minute intro call next Tuesday?\n\n` +
                    `Best regards,\n[Your Name]`;
            } else if (type === 'C') {
                document.getElementById('emailC').innerText = 
                    `Subject: How a peer in your industry cut procurement costs by 25%\n\n` +
                    `Hi [First Name],\n\n` +
                    `We recently partnered with a leading brand in your sector to streamline their ${product} supply chain, helping them achieve a 25% cost reduction without sacrificing quality.\n\n` +
                    `I’d love to share a brief case study showing how we achieved this. Would you be interested in taking a look?\n\n` +
                    `Best regards,\n[Your Name]`;
            }
        }

        function runStepFour() {
            const feedback = document.getElementById('feedbackData').value;
            const output = document.getElementById('stepFourOutput');
            output.style.display = 'block';
            
            if (!feedback) {
                output.innerText = `【AI 優化建議】\n目前尚未輸入具體反饋。建議在發送第一輪 50 封信後，將客戶回信或未回信的主因填入上方，AI 將自動調整信件語氣與切入點。`;
            } else {
                output.innerText = `【AI 覆盤與腳本優化結果】\n` +
                    `針對反饋：「${feedback}」\n\n` +
                    `修改建議：\n` +
                    `1. 在開發信中直接加入「保證準時交貨」或「提供物流保險/本地倉備貨」的承諾。\n` +
                    `2. 修改後的結語範例：\n` +
                    `"We fully understand your concerns regarding shipping lead times. That’s why we offer a guaranteed 15-day delivery window backed by reliable logistics partners. Open to a quick chat?"`;
            }
        }

        // 初始化載入第一封信
        window.onload = function() {
            document.getElementById('emailA').innerText = 
                `Subject: Quick question regarding your supply chain at [Company Name]\n\n` +
                `Hi [First Name],\n\n` +
                `I noticed [Company Name] has been expanding its portfolio. Many procurement leaders I speak with are currently struggling with rising material costs and unstable lead times.\n\n` +
                `We help companies like yours source products with a 25% reduction in procurement costs while maintaining strict quality standards and a 15-day delivery window.\n\n` +
                `Are you open to reviewing a quick 2-page spec sheet this week?\n\n` +
                `Best regards,\n[Your Name]`;
        };
    </script>

</body>
</html>
